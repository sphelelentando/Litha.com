<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shop | L.I.T.H.A.</title>
<link rel="stylesheet" href="styles.css">
<style>
.catalog-shell{max-width:1400px;margin:auto;padding:36px 18px 80px}
.catalog-head{display:flex;justify-content:space-between;gap:20px;align-items:end;flex-wrap:wrap;margin-bottom:24px}
.catalog-head h1{margin:0;font-size:clamp(32px,5vw,64px)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button{border:1px solid #c9a55f;background:transparent;color:inherit;padding:10px 14px;cursor:pointer}
.filters button.active{background:#c9a55f;color:#111}
.product-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.product-card{background:#121212;border:1px solid #292929;overflow:hidden}
.product-card img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;background:#eee}
.product-info{padding:14px}
.product-info h3{margin:0 0 6px;font-size:16px}
.price{font-weight:700;margin-bottom:12px}
.option-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.option-row select{width:100%;padding:10px;background:#0b0b0b;color:#fff;border:1px solid #444}
.add-btn{width:100%;padding:12px;background:#c9a55f;border:0;color:#111;font-weight:700;cursor:pointer}
.cart-badge{position:fixed;right:16px;bottom:16px;background:#c9a55f;color:#111;padding:12px 16px;border-radius:999px;font-weight:700;z-index:10}
@media(max-width:1000px){.product-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){.product-grid{grid-template-columns:repeat(2,1fr);gap:10px}.catalog-shell{padding:24px 10px 70px}.product-info{padding:10px}.option-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="announcement">FREE SOUTH AFRICA DELIVERY ON ORDERS OVER R1,500 · EASY RETURNS · 30 DAYS</div>
<header class="site-header premium-header">
<a class="brand" href="index.html"><img src="logo-header-white.png" alt="L.I.T.H.A."></a>
<nav class="desktop-nav"><a href="index.html">HOME</a><a href="shop.html" class="active">SHOP</a><a href="shop.html?category=men">MEN</a><a href="shop.html?category=women">WOMEN</a><a href="shop.html?category=activewear">ACTIVEWEAR</a><a href="shop.html?category=accessories">ACCESSORIES</a></nav>
</header>
<main class="catalog-shell">
<div class="catalog-head">
<div><p>THE COLLECTION</p><h1>SHOP L.I.T.H.A.</h1></div>
<div class="filters">
<button data-cat="all">ALL</button><button data-cat="men">MEN</button><button data-cat="women">WOMEN</button><button data-cat="activewear">ACTIVEWEAR</button><button data-cat="accessories">ACCESSORIES</button>
</div>
</div>
<div id="productGrid" class="product-grid"></div>
</main>
<div id="cartBadge" class="cart-badge">BAG 0</div>
<script src="products.js"></script>
<script>
const grid=document.getElementById('productGrid');
const badge=document.getElementById('cartBadge');
let cart=JSON.parse(localStorage.getItem('litha_cart')||'[]');
function money(n){return 'R '+Number(n).toLocaleString('en-ZA')+'.00'}
function updateBadge(){badge.textContent='BAG '+cart.reduce((s,i)=>s+(i.qty||1),0)}
function render(cat){
 grid.innerHTML='';
 const items=window.LITHA_PRODUCTS.filter(p=>cat==='all'||p.category===cat);
 items.forEach(p=>{
  const card=document.createElement('article');card.className='product-card';
  card.innerHTML=`<img src="${p.image}" alt="${p.name}" loading="lazy"><div class="product-info"><h3>${p.name}</h3><div class="price">${money(p.price)}</div><div class="option-row"><select class="color">${p.colors.map(x=>`<option>${x}</option>`).join('')}</select><select class="size">${p.sizes.map(x=>`<option>${x}</option>`).join('')}</select></div><button class="add-btn">ADD TO BAG</button></div>`;
  card.querySelector('.add-btn').addEventListener('click',()=>{
   const color=card.querySelector('.color').value,size=card.querySelector('.size').value;
   cart.push({...p,color,size,qty:1});localStorage.setItem('litha_cart',JSON.stringify(cart));updateBadge();
  });
  grid.appendChild(card);
 });
 document.querySelectorAll('.filters button').forEach(b=>b.classList.toggle('active',b.dataset.cat===cat));
}
document.querySelectorAll('.filters button').forEach(b=>b.addEventListener('click',()=>render(b.dataset.cat)));
const q=new URLSearchParams(location.search).get('category')||'all';render(['men','women','activewear','accessories'].includes(q)?q:'all');updateBadge();
badge.addEventListener('click',()=>location.href='checkout.html');
</script>
</body>
</html>
